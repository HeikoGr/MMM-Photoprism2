name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      # Keeps an open "chore(main): release x.y.z" PR in sync with every conventional commit
      # landing on main. Merging that PR bumps package.json + package-lock.json, writes the
      # CHANGELOG entry, creates the git tag, and publishes a GitHub release.
      #
      # Version numbers therefore stop being a manual step attached to an unrelated commit,
      # which is how releases used to get skipped or end up untagged.
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # gh pr edit's own notification (not the plain "PR opened" one) shows up in the
      # GitHub inbox, not just by mail - assigning is what release-please itself has no
      # config option for.
      - name: Assign the release PR
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for number in $(echo '${{ steps.release-please.outputs.prs }}' | jq -r '.[].number'); do
            gh pr edit "$number" --add-assignee HeikoGr --repo ${{ github.repository }}
          done

      # The release commit (version bump + CHANGELOG) exists only on main. A PR back into
      # develop keeps the two branches from drifting apart. It is opened with GITHUB_TOKEN,
      # so no CI runs on it: merge it as admin past the required checks, as a merge commit.
      - name: Open back-merge PR into develop
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
        run: |
          if [ -n "$(gh pr list --repo "$REPO" --base develop --head main --state open --json number --jq '.[].number')" ]; then
            echo "Back-merge PR already open."
            exit 0
          fi
          gh pr create --repo "$REPO" --base develop --head main \
            --title "chore: merge main into develop after release${TAG:+ $TAG}" \
            --body "Brings the release commit back to develop. Merge as a merge commit, not squashed." \
            --assignee HeikoGr

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, spelling
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # lib/mmm-shared is a submodule; node_helper.js requires it at load time.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Test the minimum version declared in package.json engines, not the latest.
          # Otherwise the supported floor is never actually exercised.
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: node --run lint

      # No separate unit-test step: this module has no test suite, and "test" in package.json is
      # just an alias for "lint" (see package.json). Running it twice would be redundant.

      - name: Spell check
        run: node --run test:spelling

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only pull requests have a well-defined range of new commits to validate.
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Need the full range between base and head to lint every commit in the PR.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: |
          npx --no-install commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # lib/mmm-shared is a submodule; node_helper.js requires it at load time.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pinned to a patch release for reproducible runs. package.json engines follows
          # MagicMirror's own floor (>=22.21.1); that exact floor is not exercised here.
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: node --run lint

      - name: Test
        run: node --run test

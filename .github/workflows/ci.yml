name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MagicMirror 2.38 runs on >=22.22.2 <23 || >=24 (engines in package.json): the lower
        # bound and the current 24.
        node: ["22.22.2", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # lib/mmm-shared is a submodule; node_helper.js requires it at load time.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities in what runs on the mirror (dev tools excluded), high and critical.
      - name: Audit runtime dependencies
        if: matrix.node == '22.22.2'
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: node --run lint

      - name: Test
        run: node --run test

  # The branch rulesets require this check by name; it passes only when every Node version passed.
  check:
    name: Lint & Test
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: All Node versions passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = "success"
